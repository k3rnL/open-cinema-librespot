[package]
name = "open-cinema-librespot-oauth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
librespot-oauth = { git = "https://github.com/librespot-org/librespot.git", rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d", default-features = false, features = ["rustls-tls-webpki-roots"] }
oauth2 = { version = "5.0", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

